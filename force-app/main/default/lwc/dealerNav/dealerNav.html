<template>
    <nav class="dealer-nav" style={navStyle}>
        <div class="nav-inner">
            <a href={homeUrl} class="nav-logo-link">
                <template if:true={logoUrl}>
                    <img src={logoUrl} alt={config.brandName} class="nav-logo" />
                </template>
                <template if:false={logoUrl}>
                    <span class="nav-brand-text">{config.brandName}</span>
                </template>
            </a>

            <ul class="nav-links">
                <li>
                    <a href={homeUrl} class={homeClass}>{labels.DealerNav_Home}</a>
                </li>
                <li>
                    <a href={shopUrl} class={shopClass} onclick={handleShopClick}>{labels.DealerNav_Shop}</a>
                </li>
                <li>
                    <a href={orderHistoryUrl} class={orderHistoryClass} onclick={handleOrderHistoryClick}>{labels.DealerNav_OrderHistory}</a>
                </li>
            </ul>

            <div class="nav-user">
                <template if:true={config.isAuthenticated}>
                    <span class="user-name">{userName}</span>
                    <a href={logoutUrl} class="logout-link" onclick={handleLogoutClick}>{labels.DealerNav_Logout}</a>
                </template>
                <template if:false={config.isAuthenticated}>
                    <a href={loginUrl} class="login-link" style={ctaStyle}>{labels.DealerNav_Login}</a>
                </template>
            </div>
        </div>
    </nav>
</template>
