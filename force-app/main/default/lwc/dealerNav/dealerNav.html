<template>
    <nav class="dealer-nav" style={navStyle}>
        <div class="nav-inner">
            <a href="/dealers" class="nav-logo-link">
                <template if:true={logoUrl}>
                    <img src={logoUrl} alt={config.brandName} class="nav-logo" />
                </template>
                <template if:false={logoUrl}>
                    <span class="nav-brand-text">{config.brandName}</span>
                </template>
            </a>

            <ul class="nav-links">
                <li>
                    <a href="/dealers" class={homeClass}>Home</a>
                </li>
                <li>
                    <a href="/dealers/shop" class={shopClass} onclick={handleShopClick}>Shop</a>
                </li>
                <li>
                    <a href="/dealers/order-history" class={orderHistoryClass} onclick={handleOrderHistoryClick}>Order History</a>
                </li>
            </ul>

            <div class="nav-user">
                <template if:true={config.isAuthenticated}>
                    <span class="user-name">{userName}</span>
                    <a href="/dealers/secur/logout.jsp" class="logout-link" onclick={handleLogoutClick}>Log out</a>
                </template>
                <template if:false={config.isAuthenticated}>
                    <a href="/dealers/login" class="login-link" style={ctaStyle}>Log in</a>
                </template>
            </div>
        </div>
    </nav>
</template>
