<template>
    <div class="confirmation-container">
        <div class="confirmation-card">
            <div class="checkmark-icon">
                <lightning-icon icon-name="utility:success" size="large" alternative-text={shopLabels.DealerShop_SuccessAriaLabel}></lightning-icon>
            </div>
            <h1 class="confirmation-title">{shopLabels.DealerShop_OrderConfirmedTitle}</h1>
            <p class="confirmation-subtitle">{shopLabels.DealerShop_OrderConfirmedSubtitle}</p>
            <div class="order-number">
                <span class="order-label">{shopLabels.DealerShop_OrderNumberLabel}</span>
                <span class="order-id">{orderId}</span>
            </div>
            <button class="back-btn" onclick={handleBackToShop}>
                {shopLabels.DealerShop_BackToShop}
            </button>
        </div>
    </div>
</template>
