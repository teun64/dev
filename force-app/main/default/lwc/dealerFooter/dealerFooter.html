<template>
    <footer class="dealer-footer" style={footerStyle}>
        <div class="footer-row-image">
            <div class="footer-row-image-inner">
                <img src={carImageUrl} alt="" class="footer-car-image" />
            </div>
        </div>

        <div class="footer-row-dark">
            <div class="footer-legal-bar">
                <div class="footer-legal-logo">
                    <template if:true={logoUrl}>
                        <img src={logoUrl} alt={brandName} class={legalLogoClass} />
                    </template>
                    <template if:false={logoUrl}>
                        <span class="footer-brand-name">{brandName}</span>
                    </template>
                </div>

                <nav class="footer-legal-links">
                    <template if:true={privacyUrl}>
                        <a href={privacyUrl} class="footer-legal-link">{privacyLabel}</a>
                    </template>
                    <template if:true={legalUrl}>
                        <a href={legalUrl} class="footer-legal-link">{legalLabel}</a>
                    </template>
                    <template if:true={offerUrl}>
                        <a href={offerUrl} class="footer-legal-link">{offerLabel}</a>
                    </template>
                    <template if:true={careersUrl}>
                        <a href={careersUrl} class="footer-legal-link">{careersLabel}</a>
                    </template>
                </nav>
            </div>

            <div class="footer-bottom">
                <p class="footer-copyright">&copy; {currentYear} {footer.companyName}. All rights reserved.</p>
            </div>
        </div>
    </footer>
</template>
