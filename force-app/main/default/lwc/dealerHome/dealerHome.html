<template>
    <!-- Hero banner -->
    <div class="hero-banner" style={heroStyle}></div>

    <!-- Main content -->
    <div class="home-content">
        <div class="content-inner">
            <div class="welcome-col">
                <h1 class="welcome-title">{homeTitle}</h1>
                <template for:each={welcomeParagraphs} for:item="para">
                    <p key={para} class="welcome-para">{para}</p>
                </template>
            </div>

            <div class="cta-col">
                <template if:true={config.isAuthenticated}>
                    <div class="cta-card">
                        <h2 class="cta-heading">{homeText.DealerHome_ShopHeading}</h2>
                        <p class="cta-text">{homeText.DealerHome_ShopCta}</p>
                        <a href="/dealers/shop" class="cta-btn" style={ctaBtnStyle}>
                            {homeText.DealerHome_ShopButton} &#8250;
                        </a>
                    </div>
                </template>
                <template if:false={config.isAuthenticated}>
                    <div class="cta-card">
                        <h2 class="cta-heading">{homeText.DealerHome_LoginHeading}</h2>
                        <a href="/dealers/login" class="cta-btn" style={ctaBtnStyle}>
                            {homeText.DealerHome_LoginButton} &#8250;
                        </a>
                        <div class="become-dealer-prompt">
                            <span class="become-dealer-text">{homeText.DealerHome_NotADealer}</span>
                            <button type="button" class="become-dealer-btn" onclick={handleBecomeDealerClick}>
                                {homeText.DealerHome_BecomeDealer}
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <template if:true={isSignupModalOpen}>
        <div class="signup-modal-overlay" onclick={handleCloseSignupModal}>
            <div class="signup-modal" role="dialog" aria-modal="true" aria-label={homeText.DealerHome_SignupTitle} onclick={handleModalContentClick}>
                <div class="signup-modal-header">
                    <h2 class="signup-modal-title">{homeText.DealerHome_SignupTitle}</h2>
                    <button type="button" class="signup-modal-close" onclick={handleCloseSignupModal} aria-label={homeText.DealerHome_Close}>&times;</button>
                </div>

                <div class="signup-modal-body">
                    <template if:true={signupSuccess}>
                        <div class="signup-success">
                            {homeText.DealerHome_SignupSuccess}
                        </div>
                    </template>

                    <template if:false={signupSuccess}>
                        <template if:true={signupError}>
                            <div class="signup-error">{signupError}</div>
                        </template>

                        <div class="signup-form">
                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_CompanyName} *</label>
                                    <input type="text" class="form-input" data-field="companyName"
                                        value={form.companyName} onchange={handleFormChange} />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_ContactName} *</label>
                                    <input type="text" class="form-input" data-field="contactName"
                                        value={form.contactName} onchange={handleFormChange} />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_Email} *</label>
                                    <input type="email" class="form-input" data-field="email"
                                        value={form.email} onchange={handleFormChange} />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_CocNumber} *</label>
                                    <input type="text" class="form-input" data-field="cocNumber"
                                        value={form.cocNumber} onchange={handleFormChange} />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_VatNumber} *</label>
                                    <input type="text" class="form-input" data-field="vatNumber"
                                        value={form.vatNumber} onchange={handleFormChange} />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_Phone}</label>
                                    <input type="tel" class="form-input" data-field="phone"
                                        value={form.phone} onchange={handleFormChange} />
                                </div>
                            </div>

                            <p class="form-group-label">{homeText.DealerHome_VisitingAddress} *</p>
                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_Street} *</label>
                                    <input type="text" class="form-input" data-field="street"
                                        value={form.street} onchange={handleFormChange} />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_PostalCode} *</label>
                                    <input type="text" class="form-input" data-field="postalCode"
                                        value={form.postalCode} onchange={handleFormChange} />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_City} *</label>
                                    <input type="text" class="form-input" data-field="city"
                                        value={form.city} onchange={handleFormChange} />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_Country} *</label>
                                    <input type="text" class="form-input" data-field="country"
                                        value={form.country} onchange={handleFormChange} />
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-field">
                                    <label class="form-label">{homeText.DealerHome_Message}</label>
                                    <textarea class="form-input form-textarea" data-field="message" rows="5"
                                        value={form.message} onchange={handleFormChange}></textarea>
                                </div>
                            </div>

                            <button class="signup-btn" onclick={handleSignupSubmit}
                                disabled={signupLoading} style={ctaBtnStyle}>
                                <template if:true={signupLoading}>{homeText.DealerHome_Submitting}</template>
                                <template if:false={signupLoading}>{homeText.DealerHome_Submit} &#8250;</template>
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>
</template>
